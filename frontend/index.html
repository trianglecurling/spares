<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta
      name="description"
      content="Triangle Curling Club in the Raleigh, Durham, and Chapel Hill area offers learn-to-curl, league play, bonspiels, and group events."
    />
    <meta property="og:site_name" content="Triangle Curling" />
    <meta property="og:title" content="Triangle Curling" />
    <meta
      property="og:description"
      content="Triangle Curling Club in the Raleigh, Durham, and Chapel Hill area offers learn-to-curl, league play, bonspiels, and group events."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Triangle Curling" />
    <meta
      name="twitter:description"
      content="Triangle Curling Club in the Raleigh, Durham, and Chapel Hill area offers learn-to-curl, league play, bonspiels, and group events."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Fraunces is self-hosted and preloaded so public-display headlines (homepage hero)
      do not flash from an oversized system serif while Google Fonts CSS + files arrive.
      OFL license: https://scripts.sil.org/OFL
    -->
    <link
      rel="preload"
      href="/fonts/fraunces-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Fraunces';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/fraunces-latin-var.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
          U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Times New Roman scaled to Fraunces metrics (Capsize avg A–Z/a–z) to limit swap CLS. */
      @font-face {
        font-family: 'Fraunces Fallback';
        src: local('Times New Roman'), local('TimesNewRoman'), local('Liberation Serif');
        size-adjust: 121.02%;
        ascent-override: 80.81%;
        descent-override: 21.07%;
        line-gap-override: 0%;
      }
    </style>
    <title>Triangle Curling</title>
    <script>
      (function() {
        // Apply theme immediately before React loads to prevent flash.
        // Source of truth: localStorage('themePreference') with values 'light' | 'dark' | 'system'.
        //
        // Public marketing routes always use light UI (see PublicLightThemeOutlet in App.tsx).
        // If we only read OS dark here, the first paint is dark until React runs — match those
        // routes here so the initial background matches the public shell.
        var path = window.location.pathname;
        function isPublicLightPath(p) {
          if (p === '/' || p === '/feedback' || p === '/calendar/public') return true;
          if (p === '/help' || p.indexOf('/help/') === 0) return true;
          if (p === '/contact' || p.indexOf('/contact/') === 0) return true;
          if (p === '/donate' || p.indexOf('/donate/') === 0) return true;
          if (p.indexOf('/mailing-list/') === 0) return true;
          if (p === '/articles' || p.indexOf('/articles/') === 0) return true;
          if (p.indexOf('/article/') === 0) return true;
          if (p === '/events' || p.indexOf('/events/') === 0) return true;
          if (p === '/leagues/public' || p.indexOf('/leagues/public/') === 0) return true;
          if (p === '/public/leagues' || p.indexOf('/public/leagues/') === 0) return true;
          if (p.indexOf('/go/') === 0) return true;
          if (p === '/admin/content/articles/draft-preview') return true;
          if (/^\/admin\/content\/articles\/\d+\/versions\/\d+\/preview$/.test(p)) return true;
          return false;
        }

        var root = document.documentElement;
        var resolved;
        if (isPublicLightPath(path)) {
          resolved = 'light';
        } else {
          var stored = localStorage.getItem('themePreference');
          resolved =
            stored === 'dark'
              ? 'dark'
              : stored === 'light'
                ? 'light'
                : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        }

        root.classList.remove('dark');
        if (resolved === 'dark') root.classList.add('dark');
        // Keep native controls consistent too
        root.style.colorScheme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
