name: Deploy application

on:
  workflow_call:
    inputs:
      app_root:
        required: true
        type: string
      systemd_unit:
        required: true
        type: string
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      SSH_USER:
        required: true
      SSH_HOST:
        required: true

concurrency:
  group: deploy-${{ inputs.app_root }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_ROOT: ${{ inputs.app_root }}
      UNIT: ${{ inputs.systemd_unit }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build:frontend

      - name: Build backend
        run: bun run build:backend

      - name: Install production backend dependencies
        run: |
          rm -rf /tmp/tccnc-backend-prod
          mkdir -p /tmp/tccnc-backend-prod
          cp backend/package.json /tmp/tccnc-backend-prod/
          cd /tmp/tccnc-backend-prod
          bun install --production --no-save

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Prepare staging directories
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "APP_ROOT=$(printf '%q' "$APP_ROOT") bash -s" << 'EOF'
            set -euo pipefail
            DEPLOY_USER="$(whoami)"
            sudo mkdir -p "$APP_ROOT/dist.next" "$APP_ROOT/backend.next" "$APP_ROOT/shared"
            sudo chown "$DEPLOY_USER:$DEPLOY_USER" "$APP_ROOT" || true
            sudo chown -R "$DEPLOY_USER:$DEPLOY_USER" "$APP_ROOT/dist.next" "$APP_ROOT/backend.next"
          EOF

      - name: Stage frontend
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='node_modules' \
            --exclude='.git' \
            frontend/dist/ "$SSH_USER@$SSH_HOST:$APP_ROOT/dist.next/"

      - name: Stage backend
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='data' \
            --exclude='.env' \
            --exclude='node_modules' \
            backend/dist/ \
            "$SSH_USER@$SSH_HOST:$APP_ROOT/backend.next/"
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            backend/package.json \
            "$SSH_USER@$SSH_HOST:$APP_ROOT/backend.next/"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            /tmp/tccnc-backend-prod/node_modules/ \
            "$SSH_USER@$SSH_HOST:$APP_ROOT/backend.next/node_modules/"

      - name: Cut over and restart
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            scripts/deploy-cutover.sh \
            "$SSH_USER@$SSH_HOST:/tmp/tccnc-deploy-cutover.sh"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "APP_ROOT=$(printf '%q' "$APP_ROOT") UNIT=$(printf '%q' "$UNIT") bash -s" << 'EOF'
            set -euo pipefail
            bash /tmp/tccnc-deploy-cutover.sh --app-root "$APP_ROOT" --unit "$UNIT"
          EOF
